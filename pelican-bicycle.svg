      <circle cx="648" cy="182" r="3.2"/>
      <circle cx="668" cy="184" r="2.9"/>
      <circle cx="688" cy="187" r="2.6"/>
    </g>

    <!-- eye -->
    <g>
      <circle cx="596" cy="182" r="12.5" fill="#ffffff" stroke="#39454d" stroke-width="3"/>
      <circle cx="599" cy="182" r="6.8" fill="#2f3a42"/>
      <circle cx="601.4" cy="179.4" r="2.4" fill="#ffffff"/>
      <path d="M580,163 C588,158 601,158 610,163" fill="none" stroke="#39454d" stroke-width="3.6" stroke-linecap="round"/>
