    <rect width="1000" height="800" fill="url(#sky)"/>
    <circle cx="884" cy="104" r="120" fill="url(#sunGlow)"/>
    <circle cx="884" cy="104" r="50" fill="#ffea9f"/>

    <g fill="#ffffff" opacity="0.9">
      <path d="M170,180 C170,156 190,140 213,144 C220,122 244,112 264,124 C278,108 304,110 315,128 C338,126 354,142 352,162 C350,176 337,184 320,184 L188,184 C176,184 170,183 170,180 Z"/>
      <path d="M634,118 C634,102 648,90 664,93 C670,78 687,71 701,80 C711,69 729,71 736,84 C752,83 763,94 761,108 C759,118 750,124 738,124 L648,124 C638,124 634,123 634,118 Z" opacity="0.75"/>
      <path d="M74,312 C74,299 86,289 100,292 C106,279 120,274 132,282 C141,273 156,275 162,286 C175,285 184,294 182,306 C180,314 172,319 162,319 L86,319 C78,319 74,317 74,312 Z" opacity="0.6"/>
    </g>

    <!-- flying birds -->
    <g stroke="#7d9aa8" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.55">
      <path d="M246,246 C252,240 258,240 263,245 C268,240 274,240 280,246"/>
      <path d="M300,214 C305,209 310,209 314,213 C318,209 323,209 328,214"/>
      <path d="M212,292 C216,288 220,288 224,291 C228,288 232,288 236,292"/>
