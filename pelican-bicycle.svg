    <path d="M 344 352 C 344 342 372 338 394 342 C 412 345 426 350 430 356 C 433 361 428 367 418 367 L 356 367 C 348 367 344 361 344 352 Z" fill="#54433a"/>
    <path d="M 350 356 C 366 350 396 350 416 358" stroke="#6d594d" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- руль -->
    <path d="M 636 388 L 634 352" stroke="#454b54" stroke-width="9" fill="none"/>
    <path d="M 634 352 C 616 332 588 326 562 334" stroke="#454b54" stroke-width="9" fill="none"/>
    <path d="M 568 336 L 550 340" stroke="#6b4f3c" stroke-width="17" fill="none"/>
    <circle cx="612" cy="330" r="9" fill="#f0c04a"/>
    <circle cx="610" cy="328" r="3" fill="#fff0b8" opacity="0.8"/>
  </g>

  <!-- ================= ПЕЛИКАН ================= -->
  <g id="pelican" stroke-linecap="round" stroke-linejoin="round">
    <!-- дальняя ступня на педали -->
    <path d="M 404 480 C 418 478 432 482 438 490 C 428 496 406 494 400 488 Z" fill="#e8a94f"/>

