<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Пеликан на велосипеде</title>
  <desc id="dsc">Весёлый пеликан с длинным клювом и большим горловым мешком едет на красном велосипеде по просёлочной дороге.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ee"/>
      <stop offset="0.5" stop-color="#d6ecf7"/>
      <stop offset="1" stop-color="#fdf2da"/>
    </linearGradient>
    <linearGradient id="body" x1="0.25" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.6" stop-color="#f6f1e2"/>
      <stop offset="1" stop-color="#e3d9c2"/>
    </linearGradient>
    <linearGradient id="wing" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f2ebd8"/>
      <stop offset="1" stop-color="#d7cdb4"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcd7c"/>
      <stop offset="1" stop-color="#e58c28"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbc776"/>
      <stop offset="0.5" stop-color="#f1a94c"/>
      <stop offset="1" stop-color="#e08429"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#828a95"/>
      <stop offset="1" stop-color="#5c636d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05a3f"/>
      <stop offset="1" stop-color="#bf3a24"/>
    </linearGradient>
  </defs>

  <!-- ================= ФОН ================= -->
  <rect x="0" y="0" width="960" height="720" fill="url(#sky)"/>

  <circle cx="822" cy="116" r="92" fill="#ffd873" opacity="0.25"/>
  <circle cx="822" cy="116" r="58" fill="#ffdf8a"/>
  <circle cx="822" cy="116" r="44" fill="#ffe9a8"/>

  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="165" cy="132" rx="52" ry="34"/>
    <ellipse cx="212" cy="112" rx="62" ry="44"/>
    <ellipse cx="258" cy="136" rx="44" ry="30"/>
    <ellipse cx="205" cy="148" rx="80" ry="26"/>
    <ellipse cx="612" cy="86" rx="34" ry="22"/>
    <ellipse cx="644" cy="72" rx="42" ry="30"/>
    <ellipse cx="676" cy="90" rx="30" ry="20"/>
    <ellipse cx="836" cy="236" rx="30" ry="20"/>
    <ellipse cx="872" cy="222" rx="40" ry="28"/>
    <ellipse cx="906" cy="238" rx="26" ry="18"/>
  </g>

  <g fill="none" stroke="#6d8496" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <path d="M 300 168 q 11 -13 22 0 q 11 -13 22 0"/>
    <path d="M 358 128 q 9 -11 18 0 q 9 -11 18 0"/>
    <path d="M 420 196 q 8 -10 16 0 q 8 -10 16 0"/>
  </g>

  <path d="M 0 566 C 120 508 210 548 306 522 C 424 490 528 548 646 516 C 766 484 862 532 960 504 L 960 660 L 0 660 Z" fill="#a9cf92"/>
  <path d="M 0 604 C 150 562 286 604 424 580 C 566 556 706 604 960 572 L 960 660 L 0 660 Z" fill="#8cbd76"/>

  <rect x="0" y="625" width="960" height="95" fill="url(#road)"/>
  <rect x="0" y="625" width="960" height="7" fill="#9aa2ac" opacity="0.8"/>
  <g stroke="#f2f0e6" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <path d="M 30 690 h 90"/>
    <path d="M 170 690 h 90"/>
    <path d="M 310 690 h 90"/>
    <path d="M 450 690 h 90"/>
    <path d="M 590 690 h 90"/>
    <path d="M 730 690 h 90"/>
    <path d="M 870 690 h 90"/>
  </g>

  <g stroke="#6aa758" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 96 628 q 6 -16 14 -20"/>
    <path d="M 108 628 q 2 -20 12 -26"/>
    <path d="M 356 630 q 6 -14 14 -18"/>
    <path d="M 560 628 q 4 -16 12 -20"/>
    <path d="M 852 630 q 6 -15 14 -19"/>
  </g>

  <g fill="#e7dcc6" opacity="0.85">
    <circle cx="108" cy="596" r="14"/>
    <circle cx="74" cy="578" r="10"/>
    <circle cx="140" cy="572" r="8"/>
  </g>

  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55">
