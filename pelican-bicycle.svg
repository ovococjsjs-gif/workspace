      <circle cx="668" cy="592" r="94" fill="none" stroke="#2e3940" stroke-width="21"/>
      <circle cx="668" cy="592" r="86" fill="none" stroke="#cfd9e1" stroke-width="8"/>
      <path d="M604,536 A90,90 0 0,1 668,502" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <g stroke="#93a6b3" stroke-width="3" opacity="0.8">
        <line x1="750" y1="592" x2="586" y2="592"/>
        <line x1="739" y1="633" x2="597" y2="551"/>
        <line x1="709" y1="663" x2="627" y2="521"/>
        <line x1="668" y1="674" x2="668" y2="510"/>
        <line x1="627" y1="663" x2="709" y2="521"/>
        <line x1="597" y1="633" x2="739" y2="551"/>
      </g>
      <circle cx="668" cy="592" r="14" fill="#5b6975" stroke="#2e3940" stroke-width="3"/>
      <circle cx="668" cy="592" r="4" fill="#c4d2dc"/>
