    <g fill="none" stroke="#d98e3c" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M640,246 C666,278 700,300 744,304"/>
      <path d="M634,274 C654,296 678,310 706,314"/>
    </g>
    <path d="M648,222 C680,240 716,250 754,250" fill="none" stroke="#ffe6b8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- upper bill -->
    <path d="M622,168 C690,166 758,178 814,190 C828,194 828,206 814,202 C752,196 686,200 628,200 C610,199 606,169 622,168 Z"
          fill="url(#billGrad)" stroke="#b96b22" stroke-width="4" stroke-linejoin="round"/>
    <path d="M636,174 C690,174 744,184 790,194" fill="none" stroke="#ffe2a3" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M630,194 C652,196 674,198 696,200" fill="none" stroke="#b96b22" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <path d="M802,188 C816,190 826,198 828,210 C820,215 806,209 796,202 Z" fill="#e08a25" stroke="#b96b22" stroke-width="3" stroke-linejoin="round"/>
