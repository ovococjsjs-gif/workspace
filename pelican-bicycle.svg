    <path d="M0,700 C140,652 300,676 452,700 C612,725 764,678 1000,702 L1000,800 L0,800 Z" fill="url(#hillFront)"/>

    <g fill="#86bfa2" opacity="0.75">
      <path d="M84,676 C80,652 96,640 112,648 C108,626 132,616 146,630 C158,616 178,624 179,642 C194,646 197,664 185,676 Z"/>
      <path d="M858,690 C854,668 870,656 885,664 C881,644 903,634 917,647 C928,634 947,641 948,658 C962,662 965,679 953,690 Z"/>
    </g>
    <g fill="#7ab694" opacity="0.55">
      <path d="M226,688 C222,668 236,658 250,665 C247,646 267,637 280,649 C290,638 307,644 308,660 C321,664 324,679 313,688 Z"/>
      <path d="M690,700 C686,682 699,673 712,679 C709,662 727,654 739,665 C748,655 763,660 764,675 C776,678 779,692 768,700 Z"/>
    </g>

    <!-- road shadow -->
    <ellipse cx="505" cy="702" rx="316" ry="20" fill="#54866a" opacity="0.26" filter="url(#softShadow)"/>

    <!-- dust -->
    <g fill="#ffffff" opacity="0.55">
      <circle cx="246" cy="690" r="14"/>
      <circle cx="220" cy="678" r="9"/>
      <circle cx="268" cy="706" r="8"/>
      <circle cx="200" cy="694" r="6"/>
    </g>

    <!-- grass -->
    <g stroke="#5f9d7b" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65">
      <path d="M118,756 C120,742 116,732 108,724"/>
      <path d="M124,756 C128,744 134,736 142,730"/>
      <path d="M130,758 C130,746 134,738 140,734"/>
      <path d="M814,768 C816,754 812,744 804,736"/>
      <path d="M820,768 C824,756 830,748 838,742"/>
      <path d="M826,770 C826,758 830,750 836,746"/>
    </g>

    <!-- ================= BICYCLE ================= -->
    <!-- rear wheel -->
    <g>
      <circle cx="330" cy="592" r="94" fill="none" stroke="#2e3940" stroke-width="21"/>
      <circle cx="330" cy="592" r="86" fill="none" stroke="#cfd9e1" stroke-width="8"/>
      <path d="M266,536 A90,90 0 0,1 330,502" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <g stroke="#93a6b3" stroke-width="3" opacity="0.8">
        <line x1="412" y1="592" x2="248" y2="592"/>
        <line x1="401" y1="633" x2="259" y2="551"/>
        <line x1="371" y1="663" x2="289" y2="521"/>
        <line x1="330" y1="674" x2="330" y2="510"/>
        <line x1="289" y1="663" x2="371" y2="521"/>
        <line x1="259" y1="633" x2="401" y2="551"/>
