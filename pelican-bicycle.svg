<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="Pelican riding a bicycle">
  <title>Pelican on a bicycle</title>
  <desc>A white pelican with an orange bill pouch and a red scarf pedals a teal bicycle through green hills under a blue sky.</desc>

  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="500" y2="800">
      <stop offset="0" stop-color="#a9dcf0"/>
      <stop offset="0.5" stop-color="#d9eff4"/>
      <stop offset="1" stop-color="#fdf3e0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffedad" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffedad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fbfbf6"/>
      <stop offset="1" stop-color="#e2e7e4"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ea"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#fdfefb"/>
      <stop offset="0.5" stop-color="#f2f6f5"/>
      <stop offset="1" stop-color="#dbe7ec"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2="0.8" y2="0.6">
      <stop offset="0" stop-color="#ffcf78"/>
      <stop offset="0.55" stop-color="#f8a944"/>
      <stop offset="1" stop-color="#ef8f2b"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.15" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffdca8"/>
      <stop offset="0.55" stop-color="#f9bb6b"/>
      <stop offset="1" stop-color="#efa04a"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbe8d6"/>
      <stop offset="1" stop-color="#b0dbc3"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#acd9bd"/>
      <stop offset="1" stop-color="#8fc6a4"/>
    </linearGradient>
    <linearGradient id="frameGrad" gradientUnits="userSpaceOnUse" x1="320" y1="420" x2="680" y2="620">
      <stop offset="0" stop-color="#3aada4"/>
      <stop offset="1" stop-color="#227f80"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1000" height="800" rx="34"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g clip-path="url(#frameClip)">
