    <path d="M 452 450 L 488 534" fill="none" stroke="#f2ad4f" stroke-width="13"/>
    <path d="M 474 528 C 492 524 510 530 518 540 C 504 548 478 544 470 536 Z" fill="#f5b757"/>
    <path d="M 474 530 C 488 528 502 532 510 538" stroke="#d8913a" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- хвост -->
    <path d="M 312 268 C 280 270 248 288 226 314 C 250 316 274 310 294 300 C 300 312 304 324 304 336 C 316 314 322 290 320 272 Z" fill="#ded3b9"/>
    <path d="M 304 282 C 282 290 262 302 250 314" fill="none" stroke="#bdb096" stroke-width="3" opacity="0.85"/>
    <path d="M 312 290 C 304 302 300 314 300 326" fill="none" stroke="#bdb096" stroke-width="3" opacity="0.85"/>

    <!-- шея -->
    <path d="M 416 300 C 400 258 408 218 440 194 C 460 179 480 172 494 168" fill="none" stroke="url(#body)" stroke-width="40"/>
    <path d="M 400 296 C 390 258 400 222 428 200" fill="none" stroke="#e2d8c0" stroke-width="7" opacity="0.5"/>

    <!-- тело -->
    <g transform="rotate(-6 384 296)">
      <ellipse cx="384" cy="296" rx="86" ry="60" fill="url(#body)"/>
      <path d="M 308 304 C 328 340 388 354 442 324 C 456 316 464 304 466 294 C 428 322 358 326 308 304 Z" fill="#e7ddc6" opacity="0.55"/>
    </g>

    <!-- дальнее крыло -->
    <path d="M 336 262 C 308 272 294 298 304 324 C 318 346 362 352 396 342 C 372 330 352 310 344 286 Z" fill="#ded4ba"/>
    <g stroke="#c3b79a" stroke-width="3" fill="none" opacity="0.9">
      <path d="M 316 288 C 332 306 352 318 376 326"/>
      <path d="M 310 304 C 326 320 346 330 368 336"/>
      <path d="M 312 320 C 326 332 344 340 360 344"/>
    </g>

    <!-- ближнее крыло: тянется к рулю -->
    <path d="M 388 258 C 442 254 496 280 530 310 C 546 324 554 336 552 346 C 548 358 532 358 520 344 C 490 306 446 288 384 286 Z" fill="url(#wing)"/>
    <g stroke="#c6bba0" stroke-width="3" fill="none" opacity="0.85">
