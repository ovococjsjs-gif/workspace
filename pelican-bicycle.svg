  <g id="leg-far">
    <path d="M 352 322 C 370 360 394 404 412 450 L 400 462 C 378 414 356 370 340 330 Z" fill="#dfa04a"/>
    <path d="M 408 448 L 420 484" fill="none" stroke="#d99a45" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ================= ВЕЛОСИПЕД ================= -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <!-- колёса -->
    <g>
      <g fill="none" stroke="#262b31" stroke-width="13">
        <circle cx="250" cy="520" r="105"/>
        <circle cx="700" cy="520" r="105"/>
      </g>
      <g fill="none" stroke="#9aa2ac" stroke-width="3">
        <circle cx="250" cy="520" r="96"/>
        <circle cx="700" cy="520" r="96"/>
      </g>
      <g fill="none" stroke="#b9c0c8" stroke-width="2.6" opacity="0.95">
        <path d="M 181 520 H 319"/>
        <path d="M 250 451 V 589"/>
        <path d="M 201 471 L 299 569"/>
        <path d="M 299 471 L 201 569"/>
        <path d="M 631 520 H 769"/>
        <path d="M 700 451 V 589"/>
        <path d="M 651 471 L 749 569"/>
        <path d="M 749 471 L 651 569"/>
