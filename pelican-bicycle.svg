    <path d="M 542 330 C 552 336 554 344 549 350" fill="none" stroke="#d6cbaf" stroke-width="3"/>

    <!-- голова -->
    <circle cx="503" cy="154" r="40" fill="url(#body)"/>
    <path d="M 475 176 C 489 188 507 190 519 184" fill="none" stroke="#e2d8c0" stroke-width="6" opacity="0.6"/>

    <!-- хохолок -->
    <path d="M 474 132 C 454 120 430 124 416 142 C 434 134 452 138 468 148 Z" fill="#f4edd9"/>

    <!-- горловой мешок -->
    <path d="M 534 162 C 578 146 630 138 688 137 C 688 155 672 172 650 186 C 622 203 588 212 566 204 C 546 196 536 178 534 162 Z" fill="url(#pouch)"/>
    <path d="M 552 174 C 560 192 574 202 590 204" fill="none" stroke="#d9852a" stroke-width="3.5" opacity="0.35" stroke-linecap="round"/>

    <!-- клюв -->
    <path d="M 532 138 C 580 130 630 126 686 124 C 694 124 696 134 688 137 C 630 138 578 146 534 162 C 528 152 528 142 532 138 Z" fill="url(#beak)"/>
    <path d="M 544 141 C 586 133 630 129 678 127" fill="none" stroke="#ffd894" stroke-width="3.5" opacity="0.85"/>
    <path d="M 684 125 C 693 126 695 134 689 137" fill="none" stroke="#d67f24" stroke-width="3.5" opacity="0.9"/>
    <path d="M 552 140 C 558 143 563 147 566 152" fill="none" stroke="#d98426" stroke-width="2.5" opacity="0.4"/>

    <!-- глаз -->
    <circle cx="508" cy="140" r="9" fill="#f8f4e8"/>
    <circle cx="509" cy="141" r="6" fill="#2b2f36"/>
    <circle cx="511" cy="138" r="2.1" fill="#ffffff"/>
    <path d="M 498 127 C 504 123 512 123 518 127" fill="none" stroke="#c3b89b" stroke-width="2.5" opacity="0.8"/>
  </g>
</svg>
