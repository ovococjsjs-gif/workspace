    <g stroke="#39454d" stroke-width="4.5" stroke-linejoin="round">
      <path d="M362,330 C330,312 300,300 274,296 C262,294 258,306 268,311 C296,324 328,340 356,354 Z" fill="#ffffff"/>
      <path d="M358,356 C322,346 288,342 262,344 C250,345 250,358 262,359 C292,364 328,372 360,376 Z" fill="#f5f9fa"/>
      <path d="M356,380 C326,384 298,394 278,408 C268,415 276,426 286,419 C312,404 338,394 360,391 Z" fill="#e7f0f4"/>
