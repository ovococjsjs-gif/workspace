      <path d="M430,258 C410,250 390,246 372,246" fill="none" stroke="#f79a8d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M432,288 C412,294 396,304 384,312" fill="none" stroke="#f79a8d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <path d="M444,248 C452,254 452,270 446,280 C438,274 436,258 444,248 Z" fill="#d9564b" stroke="#a63f39" stroke-width="3.5" stroke-linejoin="round"/>
    </g>

    <!-- wing -->
    <g>
      <path d="M452,318 C490,298 534,304 572,328 C614,352 654,372 694,386 C706,390 710,400 702,406 C694,411 684,408 676,402 C672,414 662,422 650,420 C638,418 630,410 626,402 C612,426 584,444 550,452 C506,462 460,448 438,420 C416,392 424,346 452,318 Z"
