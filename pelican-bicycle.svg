    <!-- chainring + near crank -->
    <g>
      <circle cx="492" cy="600" r="34" fill="none" stroke="#a9b8c3" stroke-width="8"/>
      <circle cx="492" cy="600" r="23" fill="none" stroke="#8b9ba7" stroke-width="4" stroke-dasharray="6 6"/>
      <line x1="492" y1="600" x2="536" y2="574" stroke="#bdcad4" stroke-width="9" stroke-linecap="round"/>
      <rect x="514" y="576" width="42" height="9" rx="4" fill="#39454d"/>
      <circle cx="492" cy="600" r="7" fill="#5b6975" stroke="#2e3940" stroke-width="2"/>
    </g>

    <!-- stem, handlebar, grip, bell -->
    <g stroke-linecap="round" fill="none">
      <path d="M614,424 L654,400" stroke="#123c42" stroke-width="16"/>
      <path d="M614,424 L654,400" stroke="url(#frameGrad)" stroke-width="10"/>
      <path d="M654,400 C672,388 692,384 710,391" stroke="#33414a" stroke-width="11"/>
      <path d="M698,385 L730,396" stroke="#6f4d38" stroke-width="16"/>
      <path d="M714,389 L730,396" stroke="#4c3427" stroke-width="16"/>
