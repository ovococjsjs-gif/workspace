    <circle cx="455" cy="520" r="25" fill="none" stroke="#7e8792" stroke-width="5"/>
    <circle cx="250" cy="520" r="17" fill="none" stroke="#7e8792" stroke-width="5"/>

    <!-- педали и шатуны -->
    <g>
      <path d="M 455 520 L 492 546" stroke="#454b54" stroke-width="8"/>
      <path d="M 455 520 L 418 494" stroke="#6b727c" stroke-width="8"/>
      <rect x="396" y="488" width="42" height="10" rx="4" fill="#4a515b"/>
