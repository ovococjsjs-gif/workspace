    <!-- feather shadow where the tail meets the body -->
    <path d="M356,330 C346,350 344,374 352,394" fill="none" stroke="#cfd8d5" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <g fill="none" stroke="#a9bdcb" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M322,364 C304,362 288,362 276,366"/>
      <path d="M316,404 C300,406 288,411 280,417"/>
    </g>

    <!-- neck + head -->
    <path d="M464,386 C448,332 450,278 472,242 C486,218 506,202 522,188 C530,160 554,142 582,144 C608,146 632,164 638,190 C644,210 636,228 618,238 C602,246 584,246 568,238 C552,252 542,270 538,292 C532,320 538,348 552,372 L568,386 Z"
